<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Package Verification</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#f6f7fb; margin:0; color:#111}
    .wrap{max-width:720px; margin:40px auto; padding:16px}
    .card{background:#fff; border-radius:16px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .title{font-size:22px; margin:0 0 10px}
    .sub{color:#555; margin:0 0 18px}
    .badge{display:inline-block; padding:8px 12px; border-radius:999px; font-weight:600}
    .ok{background:#e7f7ee; color:#116a3a}
    .warn{background:#fff4e5; color:#8a4b00}
    .bad{background:#ffe8e8; color:#8a1f1f}
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
    .item{background:#f7f8fc; border-radius:12px; padding:12px}
    .k{color:#666; font-size:13px}
    .v{font-weight:700; margin-top:4px}
    .footer{margin-top:14px; color:#666; font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">Package Verification</h1>
      <p class="sub">This page displays seal status and product information.</p>

      <div id="status" class="badge warn">Checking...</div>

      <div class="grid" id="info" style="display:none">
        <div class="item"><div class="k">Product Name</div><div class="v" id="pname"></div></div>
        <div class="item"><div class="k">Batch Number</div><div class="v" id="batch"></div></div>
        <div class="item"><div class="k">Production Date</div><div class="v" id="prod"></div></div>
        <div class="item"><div class="k">Expiry Date</div><div class="v" id="exp"></div></div>
        <div class="item"><div class="k">First Scan</div><div class="v" id="first"></div></div>
        <div class="item"><div class="k">Scan Count</div><div class="v" id="count"></div></div>
      </div>

      <div class="footer">
        Note: Multiple scans may indicate duplication or tampering if this was expected to be the first consumer scan.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://fepnnwycahurpgehtjku.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0dbDPI_5BzZlmRymLwa11w_FcyFQEnc";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(location.search);
    const code = params.get("code");

    const statusEl = document.getElementById("status");
    const infoEl = document.getElementById("info");

    function setStatus(type, text){
      statusEl.className = "badge " + type;
      statusEl.textContent = text;
    }

    async function run(){
      if(!code){
        setStatus("bad","Invalid QR code.");
        return;
      }

      const { data, error } = await sb
        .from("packages")
        .select("*")
        .eq("code", code)
        .single();

      if(error || !data){
        setStatus("bad","Code not found. Possible counterfeit.");
        return;
      }

      let firstScan = data.first_scan_time;
      let count = data.scan_count || 0;

      if(!firstScan){
        const now = new Date().toISOString();
        await sb.from("packages")
          .update({ first_scan_time: now, scan_count: 1 })
          .eq("code", code);

        firstScan = now;
        count = 1;
        setStatus("ok","First scan. Package appears authentic.");
      } else {
        await sb.from("packages")
          .update({ scan_count: count + 1 })
          .eq("code", code);

        count = count + 1;
        setStatus("bad","Previously scanned. Possible tampering.");
      }

      document.getElementById("pname").textContent = data.product_name || "-";
      document.getElementById("batch").textContent = data.batch_no || "-";
      document.getElementById("prod").textContent = data.production_date || "-";
      document.getElementById("exp").textContent = data.expiry_date || "-";
      document.getElementById("first").textContent = new Date(firstScan).toLocaleString();
      document.getElementById("count").textContent = String(count);
      infoEl.style.display = "grid";
    }

    run();
  </script>
</body>
</html>
